name: Khuzdul CI

# Trigger on pushes and pull requests to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    
    # Run tests across multiple modern Python versions
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # Speeds up builds by caching dependencies

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install Khuzdul in editable mode along with pytest (dev deps)
        pip install -e .[dev]

    - name: Run test suite
      run: |
        pytest test/ -v
