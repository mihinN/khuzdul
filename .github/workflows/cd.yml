name: Khuzdul CD

permissions:
  contents: write
# Trigger ONLY when you push a tag that starts with 'v' (e.g., v0.1.0-alpha)
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    name: Build and Create GitHub Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Build Tools
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build the Khuzdul Package
      run: |
        python -m build

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        # Automatically attach the built package files to the GitHub Release page
        files: dist/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
